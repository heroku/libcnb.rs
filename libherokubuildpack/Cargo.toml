[package]
name = "libherokubuildpack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opinionated common code for buildpacks implemented with libcnb.rs"
keywords = ["buildpacks", "CNB"]
repository = "https://github.com/heroku/libcnb.rs/tree/main/libherokubuildpack"
documentation = "https://docs.rs/libherokubuildpack"
readme = "README.md"
include = ["src/**/*", "LICENSE", "README.md"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["command", "download", "digest", "error", "inventory", "log", "inventory-semver", "inventory-sha2", "tar", "toml", "fs", "write"]
download = ["dep:reqwest", "dep:thiserror"]
digest = ["dep:hex", "dep:sha2"]
error = ["log", "dep:libcnb"]
inventory = ["dep:hex", "dep:serde", "dep:thiserror", "dep:toml"]
inventory-semver = ["dep:semver"]
inventory-sha2 = ["dep:sha2"]
log = ["dep:termcolor"]
tar = ["dep:tar", "dep:flate2"]
toml = ["dep:toml"]
fs = ["dep:pathdiff"]
command = ["write", "dep:crossbeam-utils"]
write = []

[dependencies]
crossbeam-utils = { version = "0.8.22", optional = true }
# We use the `zlib-rs` backend, since it's the fastest:
# https://github.com/rust-lang/flate2-rs#backends
# https://trifectatech.org/blog/zlib-rs-is-faster-than-c/
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"], optional = true }
hex = { version = "0.4.3", optional = true }
libcnb = { workspace = true, optional = true }
pathdiff = { version = "0.2.3", optional = true }
semver = { version = "1.0.28", features = ["serde"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha2 = { version = "0.11.0", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
termcolor = { version = "1.4.1", optional = true }
thiserror = { version = "2.0.19", optional = true }
toml = { workspace = true, optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"], optional = true }

[dev-dependencies]
serde_test = "1.0.177"
tempfile = "3.27.0"
indoc = "2.0.7"
